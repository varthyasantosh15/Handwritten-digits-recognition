# Local PostgreSQL for development: `docker compose up -d`
services:
  db:
    image: postgres:16
    container_name: digitlab-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - digitlab-data:/var/lib/postgresql/data

volumes:
  digitlab-data:
